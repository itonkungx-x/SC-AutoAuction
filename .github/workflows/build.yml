name: Build & Release Easylife in Siamcraft
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Build JAR
        run: gradle --no-daemon clean build
      - name: Verify loader API linkage (crash regression)
        run: |
          set -euo pipefail
          JAR=$(find build/libs -maxdepth 1 -name 'Easylife-in-Siamcraft-26.3-*.jar' ! -name '*-sources.jar' | head -n 1)
          test -s "$JAR"
          jar tf "$JAR" | grep -Fq 'org/itonkung/scautoauction/PriceExtractorModule.class'
          jar tf "$JAR" | grep -Fq 'org/itonkung/scautoauction/WorthPageScanner.class'
          javap -c -classpath "$JAR" org.itonkung.scautoauction.WorthPageScanner | grep -Fq 'org/lwjgl/sdl/SDLMouse'
          jar tf "$JAR" | grep -Fq 'org/itonkung/scautoauction/PriceArchive.class'
          jar tf "$JAR" | grep -Fq 'org/itonkung/scautoauction/LegacyUnitPriceParser.class'
          jar tf "$JAR" | grep -Fq 'org/itonkung/scautoauction/PriceToast.class'
          jar tf "$JAR" | grep -Fq 'org/itonkung/scautoauction/mixin/WorthKeyboardMixin.class'
          javap -p -classpath "$JAR" org.itonkung.scautoauction.EasyLifeSystemConfig | grep -Fq 'priceScanMode'
          javap -p -classpath "$JAR" org.itonkung.scautoauction.PriceExtractorModule | grep -Fq 'scanHoveredSlot'
          jar tf "$JAR" | grep -Fq 'org/itonkung/scautoauction/mixin/ContainerTooltipCaptureMixin.class'
          jar tf "$JAR" | grep -Fq 'scautoauction.mixins.json'
          jar tf "$JAR" | grep -Fq 'org/itonkung/scautoauction/EasyLifeText.class'
          jar tf "$JAR" | grep -Fq 'org/itonkung/scautoauction/PriceTextParser.class'
          jar tf "$JAR" | grep -Fq 'org/itonkung/scautoauction/EasyLifeSettingsScreen.class'
          jar tf "$JAR" | grep -Fq 'assets/scautoauction/textures/gui/siamcraft_logo.png'
          jar tf "$JAR" | grep -Fq 'assets/scautoauction/web/index.html'
          if jar tf "$JAR" | grep -Fq 'net/fabricmc/loader/api/FabricLoader.class'; then
            echo 'ERROR: included fake FabricLoader class'
            exit 1
          fi
          javap -verbose -classpath "$JAR" org.itonkung.scautoauction.EasyLifeSystemConfig > loader-linkage.txt
          grep 'InterfaceMethodref' loader-linkage.txt | grep -Fq 'FabricLoader.getInstance'
          echo 'FabricLoader interface linkage OK'
      - name: Validate dashboard JavaScript
        run: |
          node --check dashboard/api/items.js
          node --check dashboard/api/sync.js
          node - <<'NODE'
          const fs=require('fs');
          for(const path of ['dashboard/index.html','src/main/resources/assets/scautoauction/web/index.html']){
            const content=fs.readFileSync(path,'utf8');
            const found=content.match(/<script>([\s\S]*?)<\/script>/);
            if(!found)throw Error('Missing dashboard JS: '+path);
            fs.writeFileSync('/tmp/easylife-ui.mjs',found[1]);
            require('child_process').execFileSync('node',['--check','/tmp/easylife-ui.mjs'],{stdio:'inherit'});
          }
          NODE
      - name: Smoke-test safe shutdown installer
        run: |
          set -euo pipefail
          test -f build/classes/java/main/org/itonkung/scautoauction/EasyLifeInstaller.class
          JAR=$(find build/libs -maxdepth 1 -name 'Easylife-in-Siamcraft-26.3-*.jar' ! -name '*-sources.jar' | head -n 1)
          test -s "$JAR"
          DIR=$(mktemp -d)
          mkdir -p "$DIR/mods" "$DIR/easylife-updater"
          printf 'old-jar' > "$DIR/mods/previous.jar"
          cp "$JAR" "$DIR/easylife-updater/pending.jar"
          jar cfe "$DIR/install-helper.jar" org.itonkung.scautoauction.EasyLifeInstaller -C build/classes/java/main org/itonkung/scautoauction/EasyLifeInstaller.class
          java -jar "$DIR/install-helper.jar" 999999999 "$DIR/easylife-updater/pending.jar" "$DIR/mods/previous.jar"
          cmp "$JAR" "$DIR/mods/previous.jar"
          test ! -e "$DIR/easylife-updater/pending.jar"
          echo 'Shutdown installation smoke test passed'
      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Easylife-in-Siamcraft-26.3-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
      - name: Publish new version automatically
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^mod_version=//p' gradle.properties | head -n 1)
          test -n "$VERSION"
          TAG="v${VERSION}"
          JAR="build/libs/Easylife-in-Siamcraft-26.3-${VERSION}.jar"
          test -s "$JAR"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; not overwriting"
            exit 0
          fi
          gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --title "Easylife in Siamcraft $TAG (Minecraft 26.3)" --notes 'Fabric 26.3 mod: Auction and Price Extractor, real Fabric Loader linkage, Thai settings.' --latest
